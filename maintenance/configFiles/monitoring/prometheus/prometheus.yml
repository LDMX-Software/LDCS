# Copy this file in /etc/prometheus/ and modify according to instructions below
# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093


scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
    # Assuming prometheus exporter is running on same machine as graphana
      - targets: ['localhost:9090']

  - job_name:  'node_exporter'
    scrape_interval: 5s
    static_configs:
    # Change IP addresses here to act-ldmx2 and act-ruciodb2 IPs
    # Note: configure exporters to the ports listed below
      - targets: ['1.2.3.4:9100','5.6.7.8:9100']

  - job_name: 'arc_running_jobs'
    scrape_interval: 5s
    static_configs:
    # Change IP addresses here to act-ldmx2
      - targets: ['1.2.3.4:9101', '1.2.3.4:9102']


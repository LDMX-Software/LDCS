# Copy this file inside /etc/nginx/conf.d/ and change parameters accordingly
server {
   listen 443 ssl;

   server_name act-ldmx-mon.cern-test.uiocloud.no;
  
   ssl_certificate  /etc/ssl/certs/act-ldmx-mon.crt;
   ssl_certificate_key /etc/ssl/private/hostkey;

   # https://www.digitalocean.com/community/tutorials/how-to-create-a-self-signed-ssl-certificate-for-nginx-on-centos-7
   ########################################################################
   # from https://cipherli.st/                                            #
   # and https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html #
   ########################################################################

   ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
   ssl_prefer_server_ciphers on;
   ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
   ssl_ecdh_curve secp384r1;
   ssl_session_cache shared:SSL:10m;
   ssl_session_tickets off;
   ssl_stapling on;
   ssl_stapling_verify on;
   resolver 8.8.8.8 8.8.4.4 valid=300s;
   add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
   add_header X-Frame-Options DENY;
   add_header X-Content-Type-Options nosniff;

   ##################################
   # END https://cipherli.st/ BLOCK #
   ##################################



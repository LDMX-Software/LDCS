services:
  actdb:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: $ACTDB_ROOT_PASSWORD
      MYSQL_USER: $ACTDB_USER
      MYSQL_PASSWORD: $ACTDB_PASSWORD
      MYSQL_DATABASE: $ACTDB_DATABASE
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - vol-actdb-data:/var/lib/mysql:Z
  apache2:
    image: httpd:2.4
    ports:
      - 80:80
    volumes:
      - /act_logs/www/html/:/usr/local/apache2/htdocs/

volumes:
  vol-actdb-data:

